# ----------------------------------------------------------------------------------------------------
# User interaction
# ----------------------------------------------------------------------------------------------------
<<: !include engine_common.yaml

esphome:
  min_version: 2024.12.0

http_request:
  id: http_request_data
  useragent: ""
  timeout: 500ms
  verify_ssl: False

globals:
  - id: master_router_level
    type: float
    initial_value: '0'

  - id: master_real_power
    type: float
    initial_value: '0'

  - id: last_master_update
    type: uint32_t
    initial_value: '0'

# ----------------------------------------------------------------------------------------------------
# Periodic fetch (aligned with meter: 1s)
# ----------------------------------------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      - script.execute: fetch_master_router_level
      - script.execute: fetch_master_real_power

switch:
  # Define is router is active or not
  # When switch is ON, pooling timer will trigger every seconds
  - platform: template
    name: "Activate Solar Routing"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: activate
    on_turn_on:
      then:
        - light.turn_on: green_led
        - lambda: id(power_meter_activated) = 1;
    on_turn_off:
      then:
        - light.turn_off: green_led
        - number.to_min: router_level
        - lambda: |- 
            id(real_power).publish_state(NAN);
            id(consumption).publish_state(NAN);
            id(power_meter_activated) = 0;

number:
  # Router level from 0 to 100
  # This value serves two purposes:
  # 1. When solar routing is disabled: Acts as a manual control to set the router level
  # 2. When solar routing is enabled: Automatically updated to reflect the current router level
  #    Note: Manual adjustments via slider while routing is enabled are not recommended as they will be
  #          immediately overridden by the solar router's automatic control
  - platform: template
    name: "Router Level"
    id: router_level
    min_value: 0
    max_value: 100
    initial_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: True
    mode: slider
    on_value:
      then:
        - number.set:
            id: regulator_opening
            value: !lambda return id(router_level).state;
        - if:
            condition:
              number.in_range:
                id: router_level
                above: 1
            then:
              - light.turn_on:
                  id: green_led
                  effect: blink
            else:
              - light.turn_off: green_led
              - if:
                  condition:
                    - switch.is_on: activate
                  then:
                    - light.turn_on: green_led
  - platform: template
    name: "Regulator Opening"
    id: regulator_opening
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: True
    mode: slider
    internal: ${hide_regulators}
    on_value:
      then:
        - script.execute: regulation_control

  # Define the reactivity of router level
  - platform: template
    name: "Reactivity"
    id: reactivity
    optimistic: True
    restore_value: True
    mode: box
    min_value: 1
    max_value: 100
    initial_value: 10
    unit_of_measurement: ""
    step: 1

  # Define the target level of grid exchange
  #   0 : no exchange
  #  <0 : continue the send energy to the grid
  #  >0 : pull energy from the grid to better confort
  - platform: template
    name: "Target grid exchange"
    id: target_grid_exchange
    optimistic: True
    restore_value: True
    mode: box
    min_value: -99999
    max_value: 99999
    initial_value: 0
    unit_of_measurement: "W"
    step: 1

# ----------------------------------------------------------------------------------------------------
# Define scripts for power collection or energy regulation
# ----------------------------------------------------------------------------------------------------

script:
  - id: fetch_master_router_level
    mode: single
    then:
      - http_request.get:
          url: http://${master_ip}/number/router_level
          request_headers:
            Content-Type: application/json
            Connection: keep-alive
            #Authorization: ${power_meter_auth_header}
          capture_response: true
          max_response_buffer_size: 1024
          on_response:     
            then:
              - lambda: |-
                  auto pos = body.find("\"value\":");
                  if (pos != std::string::npos) {
                    float val = atof(body.substr(pos + 8).c_str());
                    id(master_router_level) = val;
                    id(last_master_update) = millis();
                  }
  - id: fetch_master_real_power
    mode: single
    then:
      - http_request.get:
          url: http://${master_ip}/sensor/real_power
          request_headers:
            Content-Type: application/json
            Connection: keep-alive
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  auto pos = body.find("\"value\":");
                  if (pos != std::string::npos) {
                    float val = atof(body.substr(pos + 8).c_str());
                    id(master_real_power) = val;
                    id(last_master_update) = millis();
                  }

  # Manage energy regulation
  # Calculate the delta of percentage to apply to the router level status to go closer to the
  # objective. Closer we are to the objective smaller are the steps. Reactivity parameter is
  # doing a ponderation on this parameter to avoid resonance effects.
  - id: energy_regulation
    mode: single
    then:
      # Define the reouter level based on power measured and grid exchange target
      # The value of regulator is a precentage and is then limited to the range 0 100
      - lambda: |-
          // Fail-safe: no update from master
          if (millis() - id(last_master_update) > 2000) {
            ESP_LOGD("pid", "master response obsolete, setting level to 0");
            id(router_level).publish_state(0);
            return;
          }

          // Master must be FULL (100%)
          if (id(master_router_level) < 100) {
            ESP_LOGD("pid", "master level under 100%, setting level to 0");
            id(router_level).publish_state(0);
            return;
          }

          // Must have enough export power
          if (id(master_real_power) >= -50.0) {
            ESP_LOGD("pid", "export over -50W, setting level to 0");
            id(router_level).publish_state(0);
            return;
          }
      
          if (isnan(id(real_power).state)) {
            id(router_level).publish_state(0);
            return;
          }
          
          // --- Persistent state ---
          static double prev_ts = 0.0;
          static double prev_error = 0.0;
          static double integral = 0.0;
          static double d_filt = 0.0;
          
          // --- Time step ---
          double now = millis() / 1000.0;
          double dt = (prev_ts > 0.0) ? (now - prev_ts) : 1.0;
          if (dt <= 0.0) dt = 1.0;
          prev_ts = now;
          
          // --- IMPROVED TUNING PARAMETERS ---
          const double POWER_SCALE = 1000.0;    // Larger scale for gentler response
          const double BASE_MAX_DELTA = 2.0;    // Much smaller base rate limit
          const double DELTA_PER_KW = 3.0;      // Less aggressive scaling
          
          // --- CONSERVATIVE PID GAINS ---
          const double Kp = 5.0;     // Much lower proportional gain
          const double Ki = 0.02;    // Lower integral gain  
          const double Kd = 0.15;    // Lower derivative gain
          const double Kb = 0.1;     // Higher anti-windup gain
          const double deadband = 25.0;  // Larger deadband for stability
          const double alpha = 0.7;      // More derivative filtering
          const double I_LIMIT = 5000.0; // Lower integral limit
          
          // --- Measurements ---
          double target = id(target_grid_exchange).state; // W
          double actual = id(real_power).state;           // W
          double error_w = target - actual;               // W (+ => need more load)
          double abs_error_w = fabs(error_w);
          
          // Deadband
          if (abs_error_w < deadband) {
            error_w = 0.0;
            abs_error_w = 0.0;
          }
          
          // Normalize error to kW units
          double error = error_w / POWER_SCALE;
          
          // IMPROVED: More aggressive integral reset on large sign changes
          if (error * prev_error < 0 && abs_error_w > 100.0) {
            integral *= 0.3;  // Keep only 30% on large sign changes
          } else if (error * prev_error < 0) {
            integral *= 0.7;  // Keep 70% on small sign changes
          }
          
          // Derivative with better filtering
          double d_raw = (error - prev_error) / dt;
          d_filt = alpha * d_filt + (1.0 - alpha) * d_raw;
          
          // PID calculation
          double p_term = Kp * error;
          double i_term = Ki * integral;
          double d_term = Kd * d_filt;
          double u = p_term + i_term + d_term;
          
          // IMPROVED: More conservative adaptive scaling
          double adaptive_max = BASE_MAX_DELTA + DELTA_PER_KW * (abs_error_w / POWER_SCALE);
          if (adaptive_max < BASE_MAX_DELTA) adaptive_max = BASE_MAX_DELTA;
          if (adaptive_max > 8.0) adaptive_max = 8.0; // Much lower safety cap
          
          // Rate limiting
          double u_rl = u;
          if (u_rl >  adaptive_max) u_rl =  adaptive_max;
          if (u_rl < -adaptive_max) u_rl = -adaptive_max;
          
          // Apply to router level and clamp
          double lvl = id(router_level).state;
          double new_lvl = lvl + u_rl;
          if (new_lvl < 0.0)   new_lvl = 0.0;
          if (new_lvl > 100.0) new_lvl = 100.0;
          
          // IMPROVED: Better anti-windup with conditional integration
          bool rate_limited = (u_rl != u);
          bool sat_high = (new_lvl >= 100.0) && (u_rl > 0.0);
          bool sat_low  = (new_lvl <= 0.0)   && (u_rl < 0.0);
          
          if (rate_limited || sat_high || sat_low) {
            // Don't integrate when saturated or rate limited
            integral += Kb * (u_rl - u) * dt;
          } else {
            // Only integrate if we're not in deadband and not saturated
            if (abs_error_w >= deadband) {
              integral += error * dt;
            }
          }
          
          // Bound integral
          if (integral >  I_LIMIT) integral =  I_LIMIT;
          if (integral < -I_LIMIT) integral = -I_LIMIT;
          
          // ADDED: Decay integral when near target
          if (abs_error_w < 50.0) {
            integral *= 0.98;  // Slow decay when close to target
          }
          
          // Publish
          id(router_level).publish_state(new_lvl);
          prev_error = error;
          
          // Debug trace
          ESP_LOGD("pid", "errW=%.0f err=%.3f P=%.2f I=%.2f D=%.2f u=%.2f u_rl=%.2f max=%.2f lvl=%.1f int=%.2f",
                   error_w, error, p_term, Ki*integral, d_term, u, u_rl, adaptive_max, new_lvl, integral);
