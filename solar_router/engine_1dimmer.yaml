# ----------------------------------------------------------------------------------------------------
# User interaction
# ----------------------------------------------------------------------------------------------------
<<: !include engine_common.yaml

switch:
  # Define is router is active or not
  # When switch is ON, pooling timer will trigger every seconds
  - platform: template
    name: "Activate Solar Routing"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: activate
    on_turn_on:
      then:
        - light.turn_on: green_led
        - lambda: id(power_meter_activated) = 1;
    on_turn_off:
      then:
        - light.turn_off: green_led
        - number.to_min: router_level
        - lambda: |- 
            id(real_power).publish_state(NAN);
            id(consumption).publish_state(NAN);
            id(power_meter_activated) = 0;

number:
  # Router level from 0 to 100
  # This value serves two purposes:
  # 1. When solar routing is disabled: Acts as a manual control to set the router level
  # 2. When solar routing is enabled: Automatically updated to reflect the current router level
  #    Note: Manual adjustments via slider while routing is enabled are not recommended as they will be
  #          immediately overridden by the solar router's automatic control
  - platform: template
    name: "Router Level"
    id: router_level
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: True
    mode: slider
    on_value:
      then:
        - number.set:
            id: regulator_opening
            value: !lambda return id(router_level).state;
        - if:
            condition:
              number.in_range:
                id: router_level
                above: 1
            then:
              - light.turn_on:
                  id: green_led
                  effect: blink
            else:
              - light.turn_off: green_led
              - if:
                  condition:
                    - switch.is_on: activate
                  then:
                    - light.turn_on: green_led
  - platform: template
    name: "Regulator Opening"
    id: regulator_opening
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: True
    mode: slider
    internal: ${hide_regulators}
    on_value:
      then:
        - script.execute: regulation_control

  # Define the reactivity of router level
  - platform: template
    name: "Reactivity"
    id: reactivity
    optimistic: True
    restore_value: True
    mode: box
    min_value: 1
    max_value: 100
    initial_value: 10
    unit_of_measurement: ""
    step: 1

  # Define the target level of grid exchange
  #   0 : no exchange
  #  <0 : continue the send energy to the grid
  #  >0 : pull energy from the grid to better confort
  - platform: template
    name: "Target grid exchange"
    id: target_grid_exchange
    optimistic: True
    restore_value: True
    mode: box
    min_value: -99999
    max_value: 99999
    initial_value: 0
    unit_of_measurement: "W"
    step: 1

# ----------------------------------------------------------------------------------------------------
# Define scripts for power collection or energy regulation
# ----------------------------------------------------------------------------------------------------

script:
  # Manage energy regulation
  # Calculate the delta of percentage to apply to the router level status to go closer to the
  # objective. Closer we are to the objective smaller are the steps. Reactivity parameter is
  # doing a ponderation on this parameter to avoid resonance effects.
  - id: energy_regulation
    mode: single
    then:
      # Define the reouter level based on power measured and grid exchange target
      # The value of regulator is a precentage and is then limited to the range 0 100
      - lambda: |-
          if (isnan(id(real_power).state) || id(safety_limit)) {
            id(router_level).publish_state(0);
            return;
          }
          
          if (id(hc).state == true) {
            id(router_level).publish_state(100.0);
            return;
          }
          
          // --- Persistent state ---
          static double prev_ts = 0.0;
          static double prev_error = 0.0;
          static double integral = 0.0;
          static double d_filt = 0.0;
          
          // --- Time step ---
          double now = millis() / 1000.0;
          double dt = (prev_ts > 0.0) ? (now - prev_ts) : 1.0;
          if (dt <= 0.0) dt = 1.0;
          prev_ts = now;
          
          // --- Tuned parameters (aim: remove ~10% offset without overshoot) ---
          const double Kp = 0.36;      // ↑ a touch to tighten response
          const double Ki = 0.012;     // ↑ integral to kill steady-state error
          const double Kd = 0.10;      // derivative damping
          const double Kb = 0.04;      // anti-windup back-calculation gain
          const double max_delta = 6.0;  // %/s rate limit
          const double deadband = 25.0;  // smaller deadband → integrator can work
          const double alpha = 0.90;     // derivative LPF (higher = smoother)
          const double I_LIMIT = 6000.0; // safety cap
          
          // --- Signals ---
          double target = id(target_grid_exchange).state;  // W
          double actual = id(real_power).state;            // W
          double error = target - actual;                  // + => need more load
          
          // Deadband near zero exchange
          if (fabs(error) < deadband) error = 0.0;
          
          // Soft integral decay on sign flip (prevents rebound undershoot)
          if (error * prev_error < 0) {
            integral *= 0.6;  // keep 60% of bias instead of wiping it
          }
          
          // Derivative with low-pass filter
          double d_raw = (error - prev_error) / dt;
          d_filt = alpha * d_filt + (1.0 - alpha) * d_raw;
          
          // PID (unclamped control increment)
          double p_term = Kp * error;
          double i_term = Ki * integral;
          double d_term = Kd * d_filt;
          double u = p_term + i_term + d_term;   // requested delta (%)
          
          // Rate limit (anti-slam)
          double u_rl = u;
          if (u_rl >  max_delta) u_rl =  max_delta;
          if (u_rl < -max_delta) u_rl = -max_delta;
          
          // Apply to level and clamp
          double lvl = id(router_level).state;
          double new_lvl = lvl + u_rl;
          if (new_lvl < 0.0)   new_lvl = 0.0;
          if (new_lvl > 100.0) new_lvl = 100.0;
          
          // --- Anti-windup (back-calculation)
          // If we were rate-limited OR the output is saturated, bleed the integrator
          bool rate_limited = (u_rl != u);
          bool sat_high = (new_lvl >= 100.0) && (u_rl > 0.0);
          bool sat_low  = (new_lvl <= 0.0)   && (u_rl < 0.0);
          if (rate_limited || sat_high || sat_low) {
            // Back-calc drives integral so that u tracks u_rl
            integral += Kb * (u_rl - u) * dt;
          } else {
            // Normal integration
            integral += error * dt;
          }
          
          // Keep integral bounded
          if (integral >  I_LIMIT) integral =  I_LIMIT;
          if (integral < -I_LIMIT) integral = -I_LIMIT;
          
          // Publish
          id(router_level).publish_state(new_lvl);
          prev_error = error;
          
          // Debug:
          // ESP_LOGD("pid", "dt=%.2f err=%.1f P=%.2f I=%.2f D=%.2f u=%.2f u_rl=%.2f lvl=%.1f",
          //          dt, error, p_term, Ki*integral, d_term, u, u_rl, new_lvl);