# ----------------------------------------------------------------------------------------------------
# User interaction
# ----------------------------------------------------------------------------------------------------
<<: !include engine_common.yaml

switch:
  # Define is router is active or not
  # When switch is ON, pooling timer will trigger every seconds
  - platform: template
    name: "Activate Solar Routing"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: activate
    on_turn_on:
      then:
        - light.turn_on: green_led
        - lambda: id(power_meter_activated) = 1;
    on_turn_off:
      then:
        - light.turn_off: green_led
        - number.to_min: router_level
        - lambda: |- 
            id(real_power).publish_state(NAN);
            id(consumption).publish_state(NAN);
            id(power_meter_activated) = 0;

number:
  # Router level from 0 to 100
  # This value serves two purposes:
  # 1. When solar routing is disabled: Acts as a manual control to set the router level
  # 2. When solar routing is enabled: Automatically updated to reflect the current router level
  #    Note: Manual adjustments via slider while routing is enabled are not recommended as they will be
  #          immediately overridden by the solar router's automatic control
  - platform: template
    name: "Router Level"
    id: router_level
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: True
    mode: slider
    on_value:
      then:
        - number.set:
            id: regulator_opening
            value: !lambda return id(router_level).state;
        - if:
            condition:
              number.in_range:
                id: router_level
                above: 1
            then:
              - light.turn_on:
                  id: green_led
                  effect: blink
            else:
              - light.turn_off: green_led
              - if:
                  condition:
                    - switch.is_on: activate
                  then:
                    - light.turn_on: green_led
  - platform: template
    name: "Regulator Opening"
    id: regulator_opening
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: True
    mode: slider
    internal: ${hide_regulators}
    on_value:
      then:
        - script.execute: regulation_control

  # Define the reactivity of router level
  - platform: template
    name: "Reactivity"
    id: reactivity
    optimistic: True
    restore_value: True
    mode: box
    min_value: 1
    max_value: 100
    initial_value: 10
    unit_of_measurement: ""
    step: 1

  # Define the target level of grid exchange
  #   0 : no exchange
  #  <0 : continue the send energy to the grid
  #  >0 : pull energy from the grid to better confort
  - platform: template
    name: "Target grid exchange"
    id: target_grid_exchange
    optimistic: True
    restore_value: True
    mode: box
    min_value: -99999
    max_value: 99999
    initial_value: 0
    unit_of_measurement: "W"
    step: 1

# ----------------------------------------------------------------------------------------------------
# Define scripts for power collection or energy regulation
# ----------------------------------------------------------------------------------------------------

script:
  # Manage energy regulation
  # Calculate the delta of percentage to apply to the router level status to go closer to the
  # objective. Closer we are to the objective smaller are the steps. Reactivity parameter is
  # doing a ponderation on this parameter to avoid resonance effects.
  - id: energy_regulation
    mode: single
    then:
      # Define the reouter level based on power measured and grid exchange target
      # The value of regulator is a precentage and is then limited to the range 0 100
      - lambda: |-
          if (isnan(id(real_power).state) || id(safety_limit)) {
            id(router_level).publish_state(0);
            return;
          }
          
          if (id(hc).state == true) {
            id(router_level).publish_state(100.0);
            return;
          }
          
          // --- Persistent state ---
          static double prev_ts = 0.0;
          static double prev_error = 0.0;
          static double integral = 0.0;
          static double d_filt = 0.0;
          
          // --- Time step ---
          double now = millis() / 1000.0;
          double dt = (prev_ts > 0.0) ? (now - prev_ts) : 1.0;
          if (dt <= 0.0) dt = 1.0;
          prev_ts = now;
          
          // --- Scaling & adaptive limits (tuned for faster recovery on -300..-1000 W) ---
          const double POWER_SCALE = 600.0;   // normalize error (smaller -> stronger reaction)
          const double BASE_MAX_DELTA = 8.0;  // %/s minimum rate limit (faster base)
          const double DELTA_PER_KW = 12.0;   // extra %/s per 1 kW of error (more aggressive for large errors)
          
          // --- Tuned PID gains (percent per kW units) ---
          const double Kp = 16.0;    // proportional (percent per kW)
          const double Ki = 0.06;    // integral (percent per kW per s)
          const double Kd = 0.60;    // derivative (percent per kW)
          const double Kb = 0.04;    // anti-windup back-calculation gain
          const double deadband = 15.0;  // W deadband (small so integrator can act)
          const double alpha = 0.88;     // derivative low-pass (0..1)
          const double I_LIMIT = 12000.0; // integral cap (kW*s percent units)
          
          // --- Measurements ---
          double target = id(target_grid_exchange).state; // W
          double actual = id(real_power).state;           // W
          double error_w = target - actual;               // W (+ => need more load)
          double abs_error_w = fabs(error_w);
          
          // Deadband
          if (abs_error_w < deadband) {
            error_w = 0.0;
            abs_error_w = 0.0;
          }
          
          // Normalize error to kW units (smaller POWER_SCALE => stronger normalized error)
          double error = error_w / POWER_SCALE;  // in kW units
          
          // Soft integral decay on sign flip (prevents rebound undershoot but keeps bias)
          if (error * prev_error < 0) {
            integral *= 0.65;  // keep 65% of stored bias
          }
          
          // Derivative raw and filtered
          double d_raw = (error - prev_error) / dt;
          d_filt = alpha * d_filt + (1.0 - alpha) * d_raw;
          
          // PID (percent output)
          double p_term = Kp * error;            // percent
          double i_term = Ki * integral;         // percent
          double d_term = Kd * d_filt;           // percent
          double u = p_term + i_term + d_term;   // requested percent delta (unclamped)
          
          // Adaptive max_delta: stronger with larger absolute error
          double adaptive_max = BASE_MAX_DELTA + DELTA_PER_KW * (abs_error_w / POWER_SCALE);
          if (adaptive_max < BASE_MAX_DELTA) adaptive_max = BASE_MAX_DELTA;
          if (adaptive_max > 30.0) adaptive_max = 30.0; // hard safety cap (don't let it jump wildly)
          
          // Rate limit (anti-slam)
          double u_rl = u;
          if (u_rl >  adaptive_max) u_rl =  adaptive_max;
          if (u_rl < -adaptive_max) u_rl = -adaptive_max;
          
          // Apply to router level and clamp
          double lvl = id(router_level).state;
          double new_lvl = lvl + u_rl;
          if (new_lvl < 0.0)   new_lvl = 0.0;
          if (new_lvl > 100.0) new_lvl = 100.0;
          
          // Anti-windup back-calculation
          bool rate_limited = (u_rl != u);
          bool sat_high = (new_lvl >= 100.0) && (u_rl > 0.0);
          bool sat_low  = (new_lvl <= 0.0)   && (u_rl < 0.0);
          if (rate_limited || sat_high || sat_low) {
            integral += Kb * (u_rl - u) * dt;
          } else {
            integral += error * dt;
          }
          
          // Bound integral
          if (integral >  I_LIMIT) integral =  I_LIMIT;
          if (integral < -I_LIMIT) integral = -I_LIMIT;
          
          // Publish
          id(router_level).publish_state(new_lvl);
          prev_error = error;
          
          // Debug trace — uncomment for a short tune run (collect logs for ~30s)
          // ESP_LOGD("pid", "errW=%.0f err=%.3f P=%.2f I=%.2f D=%.2f u=%.2f u_rl=%.2f max=%.2f lvl=%.1f",
          //          error_w, error, p_term, Ki*integral, d_term, u, u_rl, adaptive_max, new_lvl);