<<: !include power_meter_common.yaml

esphome:
  #min_version: 2024.12.0


# ----------------------------------------------------------------------------------------------------
# Use http request component
# ----------------------------------------------------------------------------------------------------

http_request:
  id: http_request_data
  useragent: ""
  timeout: 5s
  verify_ssl: False
  headers:
    Connection: keep-alive

# ----------------------------------------------------------------------------------------------------
# Define scripts for power collection
# ----------------------------------------------------------------------------------------------------

globals:
  - id: reverse
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # Gather power reports from JSY-MK-354 Energy Meter and update globals (real_power)
  # Information are provided as json. Power exchanged with the grid is names "power"
  # When this value is positive, energy is taken from the grid.
  # When this value is negative, energy is pushed to the grid.
  - id: power_meter_source
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return network::is_connected();'
          then:
            - http_request.get:
                url: http://${power_meter_ip_address}/sensor/real_power
                request_headers:
                  Content-Type: application/json
                  #Authorization: ${power_meter_auth_header}
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("power_meter", "HTTP %d", response->status_code);
                          return;
                        }

                        bool ok = json::parse_json(body, [](JsonObject root) {
                          if (!root.containsKey("value")) return false;
                          id(real_power).publish_state(root["value"].as<float>());
                          return true;
                        });

                        if (!ok) {
                          ESP_LOGW("power_meter", "JSON parse failed");
                        }

                on_error:
                  then:
                    - lambda: |-
                        ESP_LOGW("power_meter", "HTTP request failed");
          else:
            - lambda: |-
                ESP_LOGW("custom", "Network not connected");

interval:
  - interval: 500ms
    then:
      - script.execute: power_meter_source
