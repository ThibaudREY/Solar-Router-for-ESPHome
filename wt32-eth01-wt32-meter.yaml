# ----------------------------------------------------------------------------------------------------
# ESPHome configuration - This part depends on your hardware target
# ----------------------------------------------------------------------------------------------------

esphome:
  name: wt32-eth01-2
  friendly_name: wt32-eth01-2
  min_version: 2025.3.2

esp32:
  board: wt32-eth01
  framework:
    type: arduino

# Enable logging
logger:
  baud_rate: 115200
  level: INFO
  logs:
    component: ERROR
    light: ERROR
    http_request.arduino: ERROR

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

# WiFi connection
# To activate WiFi :
#   Uncomment this section parameters and comment RJ45 ethernet section
#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password
#  # If you have a WiFi activity plannification, you may have to update the reboot timeout (Default: 15min)
#  reboot_timeout: 24h

# Configure RJ45 ethernet
# To activate RJ45 ethernet :
#   Uncomment this section parameters and comment WiFi section
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_IN
  phy_addr: 1
  power_pin: GPIO16

# Activate web interface
web_server:
  port: 80

# ----------------------------------------------------------------------------------------------------
# Customisation
# ----------------------------------------------------------------------------------------------------

# This part of the script is designed to be used for customisation. It shouldn't be necessary to
# edit other part of the script to perform configuration.
packages:
  solar_router:
    url: https://github.com/thibaudrey/Solar-Router-for-ESPHome/
    ref: APS-ECU-C
    refresh: 1s
    files:
      - path: solar_router/common.yaml
      - path: solar_router/power_meter_wt32-eth01.yaml
        vars:
          phase_a_pin: 'A0'
          phase_b_pin: 'A1'
          phase_c_pin: 'A2'
